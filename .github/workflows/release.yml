name: release

# Builds the unsigned Play bundle and checks its manifest. Started by hand only.
# The upload key never leaves Vineet's VM: android/scripts/sign-release.sh signs the downloaded bundle there.
on:
  workflow_dispatch:

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4

      - name: Tests and release bundle
        run: ./gradlew :core:jvmTest :app:testReleaseUnitTest :app:bundleRelease

      - name: Check the release manifest
        run: |
          curl -sSL -o "$RUNNER_TEMP/bundletool.jar" https://github.com/google/bundletool/releases/download/1.17.2/bundletool-all-1.17.2.jar
          BUNDLETOOL="$RUNNER_TEMP/bundletool.jar" ./scripts/check-release-manifest.sh app/build/outputs/bundle/release/app-release.aab

      - uses: actions/upload-artifact@v4
        with:
          name: mise-release-aab-unsigned
          path: android/app/build/outputs/bundle/release/app-release.aab
