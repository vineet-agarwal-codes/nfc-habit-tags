name: android

on:
  push:
    paths-ignore: ['ios/**', 'docs/**', '.github/workflows/ios.yml']
  pull_request:
    paths-ignore: ['ios/**', 'docs/**', '.github/workflows/ios.yml']
  workflow_dispatch:

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

# Every push: unit tests + debug APK (a few minutes). The emulator e2e suite (~25 min) runs only when
# started by hand (workflow_dispatch) or when the commit message contains [e2e].
jobs:
  build-and-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
      - uses: gradle/actions/setup-gradle@v4

      - name: Unit tests and debug APK
        run: ./gradlew :core:jvmTest :app:testDebugUnitTest :app:assembleDebug :app:assembleDebugAndroidTest

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: habit-tags-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Enable KVM
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[e2e]')
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install Maestro
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[e2e]')
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

      - name: Emulator tests
        if: github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[e2e]')
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -skin 1080x2160
          working-directory: android
          script: ./scripts/e2e.sh

      - name: Upload e2e report
        if: always() && (github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[e2e]'))
        uses: actions/upload-artifact@v4
        with:
          name: e2e-report
          path: android/build/e2e
