appId: app.mise
---
- launchApp:
    stopApp: false
- tapOn: "Home"
- openLink: "habittags-debug://tap/last"
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible: "Deep work is on"
    timeout: 5000
- assertVisible: "End early"
- takeScreenshot: store_home_running
# Desk's tag can't end it: a second tap leaves it on.
- openLink: "habittags-debug://tap/last"
- launchApp:
    stopApp: false
- waitForAnimationToEnd:
    timeout: 3000
- assertVisible: "Deep work is on"
- takeScreenshot: tag_cant_end
- openLink: "habittags-debug://end/last"
- launchApp:
    stopApp: false
- extendedWaitUntil:
    notVisible: "Deep work is on"
    timeout: 8000
