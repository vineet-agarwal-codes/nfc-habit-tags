appId: app.mise
---
# Add Desk: recipe page, settings with an extra app, permissions already granted, write the tag.
- launchApp:
    stopApp: false
- tapOn: "Discover"
- extendedWaitUntil:
    visible: "Water me"
    timeout: 10000
- scrollUntilVisible:
    element: "Deep Work"
    centerElement: true
- tapOn: "Deep Work"
- assertVisible: "What it does"
- takeScreenshot: store_recipe
- scrollUntilVisible:
    element: "Add to Desk"
- tapOn: "Add to Desk"
- assertVisible: "Set up Desk"
- scrollUntilVisible:
    element: "Add apps"
- tapOn:
    text: "Add apps"
    index: 0
- tapOn: "Search your apps"
- inputText: "Contacts"
- tapOn: "Contacts"
- tapOn: "Save"
- scrollUntilVisible:
    element: "Next"
- tapOn: "Next"
- assertVisible: "Write the tag"
- takeScreenshot: store_add_tag
- tapOn: "Write to a tag"
- extendedWaitUntil:
    visible: "1 tag.*"
    timeout: 30000
- assertVisible: "Desk"
- takeScreenshot: home_one_space
- tapOn: "Desk"
- scrollUntilVisible:
    element: "Remove Desk"
- takeScreenshot: first_run_space_settings
- back
- tapOn: "Discover"
- assertNotVisible: "Deep Work"
