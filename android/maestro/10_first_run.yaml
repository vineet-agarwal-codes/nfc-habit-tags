appId: com.habittags.app
---
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible: "Plant: Water me"
    timeout: 10000
- scrollUntilVisible:
    element: "Desk: Deep Work"
- tapOn: "Desk: Deep Work"
- tapOn: "Install"
- scrollUntilVisible:
    element: "Add app"
- tapOn:
    text: "Add app"
    index: 0
- scrollUntilVisible:
    element: "Contacts"
- tapOn: "Contacts"
- scrollUntilVisible:
    element: "Write to a tag"
- tapOn: "Write to a tag"
- extendedWaitUntil:
    visible: "Tags"
    timeout: 10000
- scrollUntilVisible:
    element: "1 tag"
- scrollUntilVisible:
    element: "Uninstall"
- takeScreenshot: first_run_edit
- back
- tapOn: "My recipes"
- assertVisible: "Desk: Deep Work"
- tapOn: "Discover"
- assertNotVisible: "Desk: Deep Work"
