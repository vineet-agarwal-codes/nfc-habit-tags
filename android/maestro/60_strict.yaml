appId: com.habittags.app
---
- openLink: "habittags-debug://param/last/strictMinutes/45"
- launchApp:
    stopApp: false
- tapOn: "Desk: Deep Work"
- assertVisible: "Can't turn off with the tag for: 45 min"
- back
- openLink: "habittags-debug://tap/last"
- openLink: "habittags-debug://tap/last"
- launchApp:
    stopApp: false
- assertVisible: "On now"
- assertVisible: "Strict: .* min left"
- takeScreenshot: strict
- tapOn:
    text: "Desk: Deep Work"
    index: 1
- assertVisible: "This mode is on. End it before switching recipe or removing the tag."
- back
