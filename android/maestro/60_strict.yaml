- launchApp:
    stopApp: false
- tapOn: "My recipes"
- tapOn: "Desk: Deep Work"
- assertVisible: "Can't turn off with the tag for: 45 min"
- back
- openLink: "habittags-debug://tap/last"
- openLink: "habittags-debug://tap/last"
- launchApp:
    stopApp: false
- assertVisible: "On now"
- assertVisible: "Desk: Deep Work · strict, .* min left"
- takeScreenshot: strict
- tapOn: "My recipes"
- tapOn: "Desk: Deep Work"
- scrollUntilVisible:
    element: "Uninstall"
    timeout: 40000
- takeScreenshot: strict_edit
- assertVisible: "Turn this mode off first"
- back
