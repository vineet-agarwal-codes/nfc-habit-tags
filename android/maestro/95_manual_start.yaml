appId: com.habittags.app
---
# Install Desk without a tag, start it from the app, check the gate, then let auto-off end it.
- launchApp:
    stopApp: false
- tapOn: "Discover"
- scrollUntilVisible:
    element: "Desk: Deep Work"
    centerElement: true
- tapOn: "Desk: Deep Work"
- tapOn: "Install"
- scrollUntilVisible:
    element: "Skip for now"
- tapOn: "Skip for now"
- tapOn: "Start now"
- extendedWaitUntil:
    visible: "On now"
    timeout: 5000
- assertNotVisible: "Start now"
- takeScreenshot: manual_started
# The edit screen has no bottom bar; back returns to the tabs.
- back
- tapOn: "My recipes"
- assertVisible: "End now"
- tapOn: "End now"
- assertVisible: "End Desk: Deep Work early?"
- back
- openLink: "habittags-debug://expire-soon/app:desk-deep-work"
- launchApp:
    stopApp: false
- tapOn: "My recipes"
- extendedWaitUntil:
    notVisible: "End now"
    timeout: 150000
- assertVisible: "Start now"
- takeScreenshot: manual_after_autooff
