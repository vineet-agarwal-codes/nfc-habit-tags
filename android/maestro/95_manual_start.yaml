appId: app.mise
---
# Add Desk without a tag, start it from the app, check the gate, then let auto-off end it.
- launchApp:
    stopApp: false
- tapOn: "Discover"
- scrollUntilVisible:
    element: "Deep Work"
    centerElement: true
- tapOn: "Deep Work"
- scrollUntilVisible:
    element: "Add to Desk"
- tapOn: "Add to Desk"
- scrollUntilVisible:
    element: "Next"
- tapOn: "Next"
- tapOn: "Skip, start it from the app"
- extendedWaitUntil:
    visible: "Start now"
    timeout: 5000
- tapOn: "Start now"
- extendedWaitUntil:
    visible: "Deep work is on"
    timeout: 5000
- assertNotVisible: "Start now"
- takeScreenshot: manual_started
- tapOn: "End early"
- assertVisible: "End Desk early?"
# The gate opens with the keyboard up; the first back would only close it.
- hideKeyboard
- back
- openLink: "habittags-debug://expire-soon/app:desk-deep-work"
- launchApp:
    stopApp: false
- tapOn: "Home"
- extendedWaitUntil:
    notVisible: "Deep work is on"
    timeout: 150000
- assertVisible: "Start now"
- takeScreenshot: manual_after_autooff
