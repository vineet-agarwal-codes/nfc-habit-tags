appId: app.mise
---
# Bed's sleep hours are shown and editable; Start now outside them offers "Start anyway".
- launchApp:
    stopApp: false
- tapOn: "Discover"
- scrollUntilVisible:
    element: "Sleep Mode"
    centerElement: true
- tapOn: "Sleep Mode"
- assertVisible: "Turns on from 20:00 · ends by 05:00 \\(up to 08:00 if you sleep late\\)"
- scrollUntilVisible:
    element: "Add to Bed"
- tapOn: "Add to Bed"
- assertVisible: "Usual bedtime: 23:00"
- assertVisible: "Wake up at: 05:00"
- assertVisible: "Latest wake-up: 08:00"
- tapOn: "Usual bedtime: 23:00"
- assertVisible: "Cancel"
- takeScreenshot: bed_time_picker
- tapOn: "Cancel"
- scrollUntilVisible:
    element: "Next"
- tapOn: "Next"
- tapOn: "Skip, start it from the app"
# A one-minute window just after midnight (usual bedtime 03:00 − 3 h = 00:00, wake 00:01), so "now" is outside it.
- openLink: "habittags-debug://param/app:bed-sleep/usualBedtime/180"
- openLink: "habittags-debug://param/app:bed-sleep/wakeAt/1"
- launchApp:
    stopApp: false
- tapOn: "Home"
- assertVisible: "From 00:00"
- takeScreenshot: store_home_spaces
- tapOn: "Bed"
- assertVisible: "Turns on from 00:00 · ends by 00:01.*"
- tapOn: "Start now"
- assertVisible: "Outside its usual hours"
- takeScreenshot: bed_outside_hours
- tapOn: "Start anyway"
- extendedWaitUntil:
    visible: "Bed is on now"
    timeout: 5000
- takeScreenshot: bed_started_anyway
- back
- openLink: "habittags-debug://expire-soon/app:bed-sleep"
# Auto-off ends Bed and shows its morning checklist; close it so later flows start clean.
- launchApp:
    stopApp: false
- extendedWaitUntil:
    visible: "Good morning"
    timeout: 150000
- tapOn: "Done"
