appId: app.mise
---
- openLink: "habittags-debug://gate-words/5"
- launchApp:
    stopApp: false
# From Home or the running screen; both offer End early.
- tapOn:
    text: "Home"
    optional: true
- tapOn: "End early"
- assertVisible: "End Desk early?"
- assertVisible: "0 of [0-9]+ words"
- takeScreenshot: store_gate
- tapOn: "Start typing here…"
- inputText: "#"
- assertVisible: "Typo — press backspace and fix the highlighted letter."
- takeScreenshot: gate_typo
- eraseText: 1
- hideKeyboard
- back
- openLink: "habittags-debug://end/last"
- launchApp:
    stopApp: false
- extendedWaitUntil:
    notVisible: "Deep work is on"
    timeout: 8000
