appId: com.habittags.app
---
- openLink: "habittags-debug://gate-words/5"
- launchApp:
    stopApp: false
- tapOn: "End now"
- assertVisible: "End Desk: Deep Work early?"
- assertVisible: "0 of [0-9]+ words"
- takeScreenshot: gate
- tapOn: "Start typing here…"
- inputText: "#"
- assertVisible: "Typo — press backspace and fix the highlighted letter."
- takeScreenshot: gate_typo
- eraseText: 1
- back
- back
- openLink: "habittags-debug://tap/last"
- launchApp:
    stopApp: false
- extendedWaitUntil:
    notVisible: "On now"
    timeout: 5000
