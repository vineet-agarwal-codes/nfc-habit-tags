appId: com.habittags.app
---
# Zone lab with the debug fake scanner: teach Bed and Desk, then "Where am I?" at Desk.
- openLink: "habittags-debug://zone-fake/Bed"
- openLink: "habittags-debug://zone-lab"
- extendedWaitUntil:
    visible: "Zone lab"
    timeout: 10000
- tapOn: "Bed"
- tapOn: "Phone resting here"
- tapOn: "Record Bed"
- extendedWaitUntil:
    visible: "Saved: Bed \\(resting\\)"
    timeout: 60000
- openLink: "habittags-debug://zone-fake/Desk"
- openLink: "habittags-debug://zone-lab"
- tapOn: "Desk"
- tapOn: "Record Desk"
- extendedWaitUntil:
    visible: "Saved: Desk \\(resting\\)"
    timeout: 60000
- takeScreenshot: zone_lab_recorded
- scrollUntilVisible:
    element: "Where am I\\?"
    direction: DOWN
- tapOn: "Where am I\\?"
- extendedWaitUntil:
    visible: "Desk \\d+%.*"
    timeout: 20000
- takeScreenshot: zone_lab_guess
- tapOn: "Desk \\d+%"
- extendedWaitUntil:
    visible: "Saved: Desk. Thanks!"
    timeout: 5000
